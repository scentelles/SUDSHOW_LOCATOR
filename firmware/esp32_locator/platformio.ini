; =============================================================================
; SudShow Locator — ESP32 Firmware
; UWB positioning via BU-01 Tag + WiFi UDP broadcast
; =============================================================================

[env:lolin_d32]
platform = espressif32
board = lolin_d32
framework = arduino
monitor_speed = 115200
upload_speed = 921600

lib_deps =
    bblanchon/ArduinoJson@^7.0.0

build_flags =
    -DCORE_DEBUG_LEVEL=3
    -DARDUINO_USB_MODE=1
