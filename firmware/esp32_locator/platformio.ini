; =============================================================================
; SudShow Locator — ESP32 Firmware
; UWB positioning via BU-01 Tag + WiFi UDP broadcast
; =============================================================================

[env]
platform = espressif32
framework = arduino
monitor_speed = 115200
upload_speed = 921600
lib_deps =
    bblanchon/ArduinoJson@^7.0.0

[env:lolin_d32]
board = lolin_d32
build_flags =
    -DCORE_DEBUG_LEVEL=3
    -DARDUINO_USB_MODE=1
    -D BOARD_LOLIN

[env:ttgo_oled]
board = esp32dev
upload_port = COM3
upload_speed = 460800
upload_flags =
    --before=default_reset
    --after=hard_reset
lib_deps =
    ${env.lib_deps}
    adafruit/Adafruit SSD1306@^2.5.9
    adafruit/Adafruit GFX Library@^1.11.9
build_flags =
    -DCORE_DEBUG_LEVEL=3
    -D BOARD_TTGO
